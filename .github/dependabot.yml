# Mises à jour automatiques des dépendances (PR ouvertes par Dependabot)
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Abidjan
    open-pull-requests-limit: 5
    groups:
      correctifs-backend:
        update-types: [minor, patch]
    ignore:
      # Express 5 : migration à planifier (routes, gestion d'erreurs) — fait échouer les tests
      - dependency-name: express
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Abidjan
    open-pull-requests-limit: 5
    groups:
      correctifs-client:
        update-types: [minor, patch]
    ignore:
      # Babel 8 : migration à planifier avec webpack / babel-loader — casse la compilation
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
