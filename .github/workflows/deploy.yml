name: Residence Deployment 🚀

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy on VPS
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
          cd /var/www/ResidenceMeubl-

          git fetch origin main
          git reset --hard origin/main

          cd client
          npm install --legacy-peer-deps
          npm run build
          cp -r public/images dist/images

          rm -rf /var/www/residences/*
          cp -r dist/* /var/www/residences/

          cd ../backend
          npm install --production

          rm -rf /var/www/residences-api/*
          cp -r . /var/www/residences-api/

          cd /var/www/residences-api
          pm2 restart residences-api || pm2 start server.js --name residences-api
          pm2 save
        EOF