<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11131a" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="Sankofart Résidence - Réservation de résidences meublées de luxe et confort."
    />

    <title>Sankofart Résidence</title>
    <script>
      // Appliquer le thème avant l'affichage (évite un flash blanc en mode sombre)
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>

  <body>
    <noscript>Vous devez activer JavaScript pour utiliser ce site.</noscript>
    <div id="root"></div>
  </body>
</html>
