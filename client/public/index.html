<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="Sankofart Résidence - Réservation de résidences meublées de luxe et confort."
    />

    <!-- Polices : Playfair Display (titres), Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" />
    <title>Sankofart Résidence</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Manifeste : le back-office (/admin) s'installe comme une application à part
      (function () {
        var admin = location.pathname.indexOf('/admin') === 0;
        if (admin) {
          var robots = document.createElement('meta');
          robots.name = 'robots';
          robots.content = 'noindex, nofollow';
          document.head.appendChild(robots);
        }
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = admin ? '/admin/manifest.webmanifest' : '/manifest.json';
        document.head.appendChild(link);
        var titre = document.createElement('meta');
        titre.name = 'apple-mobile-web-app-title';
        titre.content = admin ? 'Sankofart Admin' : 'Sankofart';
        document.head.appendChild(titre);
        // Service worker du back-office (permet l'installation dès la page de connexion)
        if (admin && 'serviceWorker' in navigator) {
          navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(function () {});
        }
      })();
    </script>
    <script>
      // Appliquer le thème avant l'affichage (évite un flash blanc en mode sombre)
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>

  <body>
    <noscript>Vous devez activer JavaScript pour utiliser ce site.</noscript>
    <div id="root"></div>
  </body>
</html>
