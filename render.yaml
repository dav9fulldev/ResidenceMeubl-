# Configuration Render (Blueprint) — backend Sankofart Résidence
# Render > New > Blueprint > choisir ce dépôt : le service est créé automatiquement.
services:
  - type: web
    name: sankofart-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    # --omit=dev : n'installe pas les outils de test (évite le téléchargement de MongoDB en mémoire)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render passe par Cloudflare : la vraie IP du visiteur est dans cet en-tête
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      # Valeurs à saisir dans le tableau de bord Render (jamais dans Git)
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Render gratuit bloque le SMTP : les emails passent par l'API Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Paiement de l'acompte PI-SPI
      - key: PISPI_BASE_URL
        sync: false
      - key: PISPI_TOKEN_URL
        sync: false
      - key: PISPI_PARTICIPANT_CODE
        sync: false
      - key: PISPI_CLIENT_ID
        sync: false
      - key: PISPI_CLIENT_SECRET
        sync: false
      - key: PISPI_API_KEY
        sync: false
      - key: PISPI_SCOPES
        sync: false
      - key: PISPI_PAYEE_ALIAS
        sync: false
      - key: PISPI_WEBHOOK_SECRET
        sync: false
      - key: PISPI_APP_URL
        sync: false
      # Politique de remboursement de l'acompte (valeurs par défaut ;
      # le back-office, page Paramètres, les remplace dès qu'elles y sont enregistrées)
      - key: ACOMPTE_REMBOURSEMENT_POURCENTAGE
        value: "50"
      - key: ACOMPTE_REMBOURSABLE_APRES_PAIEMENT_JOURS
        value: "5"
      - key: ACOMPTE_NON_REMBOURSABLE_AVANT_ARRIVEE_JOURS
        value: "3"
